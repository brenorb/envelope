<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A link-shaped launcher for Nostr napplets.">
    <title>Hosted Nowhere</title>
    <style>
      :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #111; color: #eee; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
      header { padding: 1rem 1.25rem; border-bottom: 1px solid #333; }
      h1 { margin: 0; font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; }
      #status { margin: 0; padding: .75rem 1.25rem; color: #aaa; }
      #unlock { display: flex; gap: .5rem; align-items: center; padding: 0 1.25rem .75rem; }
      #unlock[hidden] { display: none; }
      #unlock input { min-width: min(24rem, 70vw); padding: .45rem .6rem; background: #1c1c1c; color: #eee; border: 1px solid #555; border-radius: .25rem; }
      #unlock button { padding: .45rem .75rem; color: #111; background: #b9e6b9; border: 0; border-radius: .25rem; cursor: pointer; }
      #stage { min-height: 0; }
      #stage iframe { display: block; width: 100%; height: calc(100vh - 7rem); min-height: 20rem; border: 0; background: #fff; }
      [data-state="error"] { color: #ffaaa5; }
      [data-state="ready"] { color: #b9e6b9; }
    </style>
  </head>
  <body>
    <header><h1>Hosted Nowhere</h1></header>
    <p id="status" role="status" aria-live="polite">Choose a napplet to open.</p>
    <form id="unlock" hidden>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Open encrypted link</button>
    </form>
    <main id="stage" aria-label="Opened napplet"></main>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch((error) => {
          console.warn('[hosted-nowhere] offline shell cache unavailable', error);
        });
      }
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
